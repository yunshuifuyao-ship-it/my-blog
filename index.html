<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云水扶摇的个人博客</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="dark-mode">

    <canvas id="bg-canvas"></canvas>

    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo" onclick="routeToHome()">云水扶摇</a>
            <ul class="nav-links">
                <li><a href="#" onclick="routeToHome()">首页</a></li>
                <li><a href="https://github.com/yunshuifuyao-ship-it/my-blog" target="_blank">GitHub</a></li>
                <li>
                    <button id="theme-toggle" class="theme-btn" aria-label="切换主题">
                        <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                        <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section id="posts-view" class="view-section">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="输入关键词，即时搜索标题、简介或正文..." />
            </div>

            <h1 class="section-title">最新文章</h1>
            <div id="posts-list" class="posts-grid">
                <div class="loading">正在随风读取文章列表...</div>
            </div>
        </section>

        <section id="content-view" class="view-section hidden">
            <button class="btn-back" onclick="routeToHome()">← 返回首页</button>
            <article id="article-detail" class="markdown-body">
                </article>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
